# Uses ingress-nginx, which runs the same way on AKS, EKS, GKE and Docker Desktop.
# Install it once per cluster: https://kubernetes.github.io/ingress-nginx/deploy/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-api-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: forge-api
                port:
                  number: 80
