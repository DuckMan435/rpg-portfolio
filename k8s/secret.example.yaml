# Copy to k8s/secret.yaml (gitignored), fill in the real URL, then:
#   kubectl apply -f k8s/secret.yaml
# Or skip the file entirely:
#   kubectl create secret generic forge-api-secret --from-literal=DATABASE_URL='postgresql://...'
apiVersion: v1
kind: Secret
metadata:
  name: forge-api-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/rpg_db"
